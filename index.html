<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-wrap">
        <span class="brand-mark">S</span>
        <div>
          <span class="brand-kicker">SUB TRACKER</span>
          <h1>내 구독 관리</h1>
        </div>
      </div>
      <button class="icon-button" id="today-button">
        <span class="icon-button-icon">●</span>
        <span id="today-label">오늘</span>
      </button>
    </header>

    <section class="summary-grid" id="summary-grid">
      <article class="summary-card monthly-card">
        <div class="summary-header">
          <span class="summary-title">월 합계</span>
          <span class="summary-icon">₩</span>
        </div>
        <div class="summary-value" id="monthly-total">0원</div>
        <div class="summary-detail">이번 달 기준</div>
      </article>

      <article class="summary-card yearly-card">
        <div class="summary-header">
          <span class="summary-title">연간 합계</span>
          <span class="summary-icon">↻</span>
        </div>
        <div class="summary-value" id="yearly-total">0원</div>
        <div class="summary-detail">12개월 환산</div>
      </article>

      <article class="summary-card upcoming-card">
        <div class="summary-header">
          <span class="summary-title">이번 주 결제 예정</span>
          <span class="summary-icon">!</span>
        </div>
        <div class="summary-value" id="week-total">0건</div>
        <div class="summary-detail" id="week-list">결제 예정 없음</div>
      </article>
    </section>

    <main class="content-grid">
      <section class="panel list-panel">
        <div class="panel-title-row">
          <div>
            <span class="section-label">구독 목록</span>
            <h2>내 구독</h2>
          </div>
          <button class="primary-button small-button" id="add-top-button">+ 구독 추가</button>
        </div>

        <div class="subscription-list" id="subscription-list">
          <div class="empty-list" id="empty-list">
            <span class="empty-icon">+</span>
            <span>구독을 추가해 주세요.</span>
          </div>
        </div>
      </section>

      <aside class="right-column">
        <section class="panel form-panel">
          <div class="panel-title-row compact-row">
            <div>
              <span class="section-label">새 구독 추가</span>
              <h2 id="form-heading">구독 추가</h2>
            </div>
          </div>

          <form id="subscription-form" class="subscription-form">
            <input type="hidden" id="subscription-id" />

            <div class="form-row">
              <label for="subscription-name">구독 서비스</label>
              <input type="text" id="subscription-name" placeholder="예: 넷플릭스" required autocomplete="off" />
            </div>

            <div class="form-row two-column">
              <div>
                <label for="category">카테고리</label>
                <select id="category" required>
                  <option value="영상">영상</option>
                  <option value="음악">음악</option>
                  <option value="운동">운동</option>
                  <option value="생산성">생산성</option>
                  <option value="기타">기타</option>
                </select>
              </div>
              <div>
                <label for="payment-method">결제 수단</label>
                <input type="text" id="payment-method" placeholder="예: 신한카드" autocomplete="off" />
              </div>
            </div>

            <div class="form-row two-column">
              <div>
                <label for="amount">월 금액</label>
                <input type="number" id="amount" min="0" required />
              </div>
              <div>
                <label for="cycle">결제 주기</label>
                <select id="cycle" required>
                  <option value="monthly" selected>월간</option>
                  <option value="yearly">연간</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <label for="next-payment-date">다음 결제일</label>
              <input type="date" id="next-payment-date" required />
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-button" id="submit-button">추가하기</button>
              <button type="button" class="secondary-button" id="cancel-edit">취소</button>
            </div>
          </form>
        </section>

        <section class="panel chart-panel">
          <div class="panel-title-row compact-row">
            <div>
              <span class="section-label">카테고리별 비중</span>
              <h2>지출 구성</h2>
            </div>
          </div>
          <div class="category-chart" id="category-chart"></div>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast">저장되었습니다.</div>

  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
</html>
